<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant of app/icon.svg for platforms that apply their own
       mask (iOS home screen, Android maskable icons): a square background
       and the artwork scaled to 78% so it stays inside the 80% safe zone. -->
