name: Deploy backend to FastComet

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: fastcomet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: fastcomet-production
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scripts
        run: |
          bash -n backend/deploy/fastcomet/deploy.sh
          bash -n backend/deploy/fastcomet/deploy-remote.sh
          bash backend/deploy/fastcomet/test-deploy.sh
          python3 backend/deploy/fastcomet/test_passenger_release.py
          bash backend/deploy/fastcomet/test-ssh-key.sh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FASTCOMET_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.FASTCOMET_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.FASTCOMET_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          bash backend/deploy/fastcomet/load-ssh-key.sh
      - name: Verify SSH authentication
        env:
          FASTCOMET_HOST: ${{ vars.FASTCOMET_HOST }}
          FASTCOMET_USER: ${{ vars.FASTCOMET_USER }}
          FASTCOMET_PORT: ${{ vars.FASTCOMET_PORT }}
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          test -n "$FASTCOMET_HOST"
          test -n "$FASTCOMET_USER"
          if ! ssh-add -l; then
            echo '::error::No unlocked key is available in the SSH agent.'
            exit 1
          fi
          echo "Checking SSH access to $FASTCOMET_USER@$FASTCOMET_HOST on port ${FASTCOMET_PORT:-17177}"
          if ! ssh -v -p "${FASTCOMET_PORT:-17177}" -o BatchMode=yes \
            -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "$FASTCOMET_USER@$FASTCOMET_HOST" \
            'printf "SSH authentication and remote commands OK\n"'; then
            echo '::error::SSH preflight failed. Review the offered public-key fingerprint above and verify that its matching public key is Authorized for this cPanel user.'
            exit 1
          fi
      - name: Transfer, install, migrate and restart
        env:
          FASTCOMET_HOST: ${{ vars.FASTCOMET_HOST }}
          FASTCOMET_USER: ${{ vars.FASTCOMET_USER }}
          FASTCOMET_PORT: ${{ vars.FASTCOMET_PORT }}
          FASTCOMET_APP_ROOT: ${{ vars.FASTCOMET_APP_ROOT }}
          FASTCOMET_PYTHON: ${{ vars.FASTCOMET_PYTHON }}
          FASTCOMET_HEALTH_URL: ${{ vars.FASTCOMET_HEALTH_URL }}
        run: bash backend/deploy/fastcomet/deploy.sh
      - name: Remove SSH credentials
        if: always()
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f ~/.ssh/known_hosts
